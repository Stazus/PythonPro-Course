{% extends "base.html" %}

{% block content %}
    <h1>Lista użytkowników</h1>

    <ul>
        {% for user in users %}
            <li>{{ user.username }} - {{ user.email }}</li>
        {% empty %}
            <li>Brak zarejestrowanych użytkowników.</li>
        {% endfor %}
    </ul>
{% endblock %}
