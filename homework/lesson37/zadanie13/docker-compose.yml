services:
  users-service:
    build: ./users-service
    depends_on:
      users-db:
        condition: service_healthy

  posts-service:
    build: ./posts-service
    depends_on:
      posts-db:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - users-service
      - posts-service

  users-db:
    image: postgres:16
    environment:
      POSTGRES_DB: usersdb
      POSTGRES_USER: usersuser
      POSTGRES_PASSWORD: userspassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usersuser -d usersdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  posts-db:
    image: postgres:16
    environment:
      POSTGRES_DB: postsdb
      POSTGRES_USER: postsuser
      POSTGRES_PASSWORD: postspassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postsuser -d postsdb"]
      interval: 5s
      timeout: 5s
      retries: 5
