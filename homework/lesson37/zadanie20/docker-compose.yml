services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: booksdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d booksdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://appuser:apppassword@database:5432/booksdb
      REDIS_URL: redis://redis:6379/2
      OLLAMA_URL: http://ollama:11434
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://appuser:apppassword@database:5432/booksdb
      REDIS_URL: redis://redis:6379/2
      OLLAMA_URL: http://ollama:11434
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:
