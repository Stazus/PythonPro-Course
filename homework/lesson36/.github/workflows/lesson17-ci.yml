name: Lesson 17 - CI

on:
  push:
    paths:
      - 'zadanie17/**'
      - '.github/workflows/lesson17-ci.yml'
  pull_request:
    paths:
      - 'zadanie17/**'
      - '.github/workflows/lesson17-ci.yml'

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: zadanie17

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: PYTHONPATH=. pytest -q
