<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{{ page_title }}</title>
</head>
<body>

    <h1>Moje ulubione filmy</h1>

<ul>
    {% for movie in movies %}
        {% if loop.index % 2 == 0 %}
            <li style="background-color: lightgray;">{{ movie }}</li>
        {% else %}
            <li style="background-color: white;">{{ movie }}</li>
        {% endif %}
    {% endfor %}
</ul>

</body>
</html>
