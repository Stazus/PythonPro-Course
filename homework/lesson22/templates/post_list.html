,<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Ostatnie posty</title>
</head>
<body>
    <h1>5 najnowszych postów</h1>

    <form method="get">
        <input
            type="text"
            name="q"
            value="{{ q }}"
            placeholder="Szukaj posta"
        >
        <button type="submit">Szukaj</button>
    </form>

    <br>

    <ul>
        {% for post in posts %}
            <li>
                {{ post.title }} — {{ post.created_at }}
            </li>
        {% empty %}
            <li>Brak postów.</li>
        {% endfor %}
    </ul>
</body>
</html>
