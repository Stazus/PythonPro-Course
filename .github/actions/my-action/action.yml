name: "Run tests and generate coverage badge"
description: "Runs pytest with coverage and generates a coverage badge"

runs:
  using: "composite"
  steps:
    - name: Install test dependencies
      shell: bash
      run: |
        python -m pip install pytest pytest-cov coverage-badge

    - name: Run tests with coverage
      shell: bash
      run: |
        python -m pytest homework/lesson38/zadanie4/tests/test_math.py \
          --cov=homework/lesson38/zadanie4 \
          --cov-report=term \
          --cov-report=xml

    - name: Generate coverage badge
      shell: bash
      run: |
        coverage-badge -o coverage.svg -f
        echo "Coverage badge generated: coverage.svg"
