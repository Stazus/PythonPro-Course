name: CI/CD Docker

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zbuduj obraz Dockera
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/lesson37-zadanie17 homework/lesson37/zadanie17

      - name: Uruchom testy w kontenerze
        run: docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/lesson37-zadanie17 pytest

      - name: Zaloguj się do Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Wypchnij obraz do Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/lesson37-zadanie17
