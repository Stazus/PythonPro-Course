name: Lekcja 38 - Zadanie 13

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install flake8 black

      - name: Run flake8
        run: flake8 homework/lesson38/zadanie7/src/

      - name: Run black check
        run: black --check homework/lesson38/zadanie7/src/

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest and coverage
        run: pip install pytest pytest-cov

      - name: Run tests with coverage
        run: pytest --cov=homework/lesson38/zadanie7/src homework/lesson38/zadanie4/tests/

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t lesson38-app homework/lesson38/zadanie13/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        run: echo "Deploying..."
