name: Lekcja 38 - Zadanie 19

on:
  push:
  workflow_dispatch:

jobs:
  aws-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start simulated ECR registry
        run: |
          docker run -d \
            --name ecr-registry \
            -p 5000:5000 \
            registry:2

          echo "Simulated ECR registry started on localhost:5000"

      - name: Build Docker image
        run: |
          docker build \
            -t localhost:5000/lesson38-zadanie19:latest \
            homework/lesson38/zadanie19/

      - name: Push image to ECR
        run: |
          docker push localhost:5000/lesson38-zadanie19:latest

      - name: Simulate ECS cluster creation
        run: |
          echo "Creating ECS cluster..."
          echo "Cluster created: lesson38-cluster"

      - name: Simulate ECS service update
        run: |
          echo "Updating ECS service..."
          echo "Cluster: lesson38-cluster"
          echo "Image: localhost:5000/lesson38-zadanie19:latest"
          echo "ECS service updated successfully!"
