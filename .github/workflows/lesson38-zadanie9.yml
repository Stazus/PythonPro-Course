name: Lekcja 38 - Zadanie 9

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 homework/lesson38/zadanie7/src/

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Run pytest
        run: pytest homework/lesson38/zadanie4/tests/test_math.py

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Build application
        run: echo "Build completed successfully!"
